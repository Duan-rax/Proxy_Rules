name: Lint Rules

on:
  pull_request:
  push:
    paths:
      - "rules/**"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install yamllint
      run: pip install yamllint

    - name: Check yaml
      # 加上 -d 参数，自定义检查规则：关闭开头检查、行长度检查和文件末尾换行检查
      run: yamllint -d "{extends: default, rules: {document-start: disable, line-length: disable, new-line-at-end-of-file: disable}}" rules
