name: Build MRS

on:
  push:
    paths:
      - "rules/**"
  workflow_dispatch: # 建议增加手动触发，方便调试

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 必须拉取全部提交历史，否则 git push 可能会失败
          fetch-depth: 0

      - name: Install latest Mihomo
        run: |
          # 获取不带 v 的版本号用于下载，带 v 的用于 echo
          VERSION_TAG=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f 4)
          VERSION=${VERSION_TAG#v} # 移除前面的 'v'
          echo "Latest Mihomo: $VERSION_TAG"

          # 修复下载链接：Mihomo 的 Release 文件名通常包含 v
          curl -L "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION_TAG}/mihomo-linux-amd64-${VERSION_TAG}.gz" -o mihomo.gz

          gunzip mihomo.gz
          # 找到解压后的二进制文件并重命名
          FILE=$(ls mihomo-linux-amd64*)
          chmod +x "$FILE"
          sudo mv "$FILE" /usr/local/bin/mihomo

          mihomo -v

      - name: Create mrs dir
        run: mkdir -p mrs

      - name: Convert rules
        run: |
          # 确保 rules 目录下有文件才执行
          if [ -d "rules" ] && [ "$(ls -A rules/*.yaml 2>/dev/null)" ]; then
            for file in rules/*.yaml; do
              name=$(basename "$file" .yaml)
              echo "Converting $name..."

              # 逻辑修复：判断内容决定类型
              if grep -q "IP-CIDR" "$file"; then
                type="ipcidr"
              else
                type="domain"
              fi

              mihomo convert-ruleset $type yaml "$file" "mrs/$name.mrs"
            done
          else
            echo "No yaml files found in rules/ directory."
          fi

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add mrs/*.mrs

          # 检查是否有变动
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Auto build MRS [skip ci]"
            # 使用默认 GITHUB_TOKEN 推送，Action 已经处理好权限
            git push
          fi
