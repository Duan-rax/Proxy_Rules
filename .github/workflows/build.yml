name: Build MRS

on:
  push:
    paths:
      - "rules/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
  # 添加手动触发支持
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取历史，确保 push 成功

      - name: Install latest Mihomo
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl_opts=(--fail --silent --show-error --location --http1.1
                     --connect-timeout 10 --max-time 45
                     --retry 3 --retry-delay 2 --retry-max-time 120 --retry-all-errors)

          release_json=$(curl "${curl_opts[@]}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          version=$(jq -er '.tag_name | strings | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<< "$release_json") || { echo "::error::Mihomo release metadata has no valid version"; exit 1; }
          asset="mihomo-linux-amd64-$version.gz"
          digest=$(jq -er --arg asset "$asset" \
            '.assets[] | select(.name == $asset) | .digest | strings | select(test("^sha256:[0-9a-f]{64}$"))' \
            <<< "$release_json") || { echo "::error::Missing SHA-256 for $asset"; exit 1; }

          echo "Latest Mihomo: $version"
          curl "${curl_opts[@]}" \
            "https://github.com/MetaCubeX/mihomo/releases/download/$version/$asset" \
            --output mihomo.gz
          printf '%s  mihomo.gz\n' "${digest#sha256:}" | sha256sum --check
          gunzip mihomo.gz
          sudo install -m 0755 mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Create mrs dir
        run: mkdir -p mrs

      - name: Convert rules
        run: |
          # 检查 rules 目录下是否有 yaml 文件
          if [ -d "rules" ] && [ "$(ls -A rules/*.yaml 2>/dev/null)" ]; then
            for file in rules/*.yaml; do
              name=$(basename "$file" .yaml)
              echo "正在转换: $name"

              # 自动判断类型
              if grep -q "IP-CIDR" "$file"; then
                type="ipcidr"
              else
                type="domain"
              fi

              mihomo convert-ruleset $type yaml "$file" "mrs/$name.mrs"
            done
          else
            echo "错误：rules/ 目录下未发现 .yaml 规则文件"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add mrs/*.mrs

          if git diff --cached --quiet; then
            echo "没有文件变动，跳过 Commit"
          else
            # [skip ci] 必加，防止自动提交再次触发 Action 导致死循环
            git commit -m "chore: 自动更新 MRS 文件 [skip ci]"
            git push
          fi

      - name: Upload built MRS
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mrs
          path: mrs/*.mrs
          if-no-files-found: error
          retention-days: 7
