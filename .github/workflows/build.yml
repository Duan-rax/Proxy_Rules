name: Build MRS

on:
  push:
    paths:
      - "rules/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest Mihomo
        run: |
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "Latest Mihomo: $VERSION"

          curl -L https://github.com/MetaCubeX/mihomo/releases/download/$VERSION/mihomo-linux-amd64-v1-$VERSION.gz -o mihomo.gz

          gunzip mihomo.gz

          FILE=$(ls mihomo-linux-amd64*)

          chmod +x "$FILE"
          sudo mv "$FILE" /usr/local/bin/mihomo

          mihomo -v

      - name: Create mrs dir
        run: mkdir -p mrs

      - name: Convert rules
        run: |
          for file in rules/*.yaml; do
            name=$(basename "$file" .yaml)

            if grep -q "IP-CIDR" "$file"; then
              type="ipcidr"
            else
              type="domain"
            fi

            mihomo convert-ruleset $type yaml "$file" "mrs/$name.mrs"
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add mrs/*.mrs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto build MRS"
            git push
          fi
