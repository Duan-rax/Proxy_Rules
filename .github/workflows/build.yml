name: Build MRS

on:
  push:
    paths:
      - "rules/**"
  # 添加手动触发支持
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取历史，确保 push 成功

      - name: Install latest Mihomo
        run: |
          # 获取带 v 的版本号 (例如 v1.18.3)
          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "Latest Mihomo: $VERSION"

          # 修正：Mihomo 的下载链接文件名包含 v
          curl -L "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-${VERSION}.gz" -o mihomo.gz

          gunzip mihomo.gz

          # 动态获取解压后的文件名并赋权
          FILE=$(ls mihomo-linux-amd64*)
          chmod +x "$FILE"
          sudo mv "$FILE" /usr/local/bin/mihomo

          mihomo -v

      - name: Create mrs dir
        run: mkdir -p mrs

      - name: Convert rules
        run: |
          # 检查 rules 目录下是否有 yaml 文件
          if [ -d "rules" ] && [ "$(ls -A rules/*.yaml 2>/dev/null)" ]; then
            for file in rules/*.yaml; do
              name=$(basename "$file" .yaml)
              echo "正在转换: $name"

              # 自动判断类型
              if grep -q "IP-CIDR" "$file"; then
                type="ipcidr"
              else
                type="domain"
              fi

              mihomo convert-ruleset $type yaml "$file" "mrs/$name.mrs"
            done
          else
            echo "错误：rules/ 目录下未发现 .yaml 规则文件"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add mrs/*.mrs

          if git diff --cached --quiet; then
            echo "没有文件变动，跳过 Commit"
          else
            # [skip ci] 必加，防止自动提交再次触发 Action 导致死循环
            git commit -m "chore: 自动更新 MRS 文件 [skip ci]"
            git push
          fi
